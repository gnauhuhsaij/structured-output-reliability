schema_version: "1.0.0"
name: offline-character-generation-smoke
description: Generate one deterministic case from every built-in family.

endpoint:
  base_url: http://127.0.0.1:8000/v1
  model: test-model
  api_key_env: TEST_API_KEY

cases:
  count: 4
  length_unit: characters
  generator_version: "1.0.0"
  families:
    - flat_object
    - nested_object
    - array_object
    - mixed_types

run:
  seed: 20261008
  repetitions: 2

structured_modes:
  - id: prompt_only
    type: prompt_only

matrix:
  concurrency:
    - 1
  prompt_lengths:
    - 2048
  output_shapes:
    - target_length: 256
      max_completion_tokens: 128
  temperatures:
    - 0
  request_seeds:
    - 42
  structured_modes:
    - prompt_only

output:
  root: ./runs
